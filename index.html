<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>말차 or 녹차</title>
<meta name="description" content="말차와 녹차를 구별하는 판별 앱">
<style>
  :root {
    --bg: #f4f5f0;
    --surface: #ffffff;
    --surface2: #f6f7f3;
    --border: #e1e4da;
    --border-strong: #cdd1c4;
    --text: #1d241b;
    --muted: #7f877a;
    --sub: #586154;
    --ink: #1d241b;
    --ok: #2f7d4f;
    --warn: #a86a00;
    --err: #b8372d;
    --cR: #c8432f; --cG: #2f8556; --cB: #2c62b0;
    --matcha: #4f7a1f; --matcha-soft: #e5efd6;
    --tea: #7a5f9e; --tea-soft: #ece4f5;
    --gray-soft: #f8ead7;
    --mono: 'SF Mono', Consolas, 'D2Coding', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
    color: var(--text); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
  }
  .app { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
  header { text-align: center; display: grid; gap: 12px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  h1 .m { color: var(--matcha); } h1 .t { color: var(--tea); } h1 .or { color: var(--muted); font-weight: 500; font-size: 18px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
  .tabs button { border: 0; background: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--sub); padding: 9px; border-radius: 7px; cursor: pointer; }
  .tabs button.on { background: var(--ink); color: #fff; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
  [hidden] { display: none !important; }
  button:focus-visible, .drop:focus-visible { outline: 2px solid var(--matcha); outline-offset: 2px; }

  /* 단계 */
  .step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
  .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .num.done { background: var(--ok); color: #fff; border-color: var(--ok); }
  .step-body { display: grid; gap: 8px; min-width: 0; }
  .step-title { font-weight: 700; font-size: 15px; }
  .step-desc { font-size: 12.5px; color: var(--muted); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-strong); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--surface); color: var(--text); }
  .btn:hover:not(:disabled) { background: var(--surface2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-primary:hover:not(:disabled) { background: #3a4437; }
  .btn-wide { width: 100%; padding: 14px; font-size: 16px; }
  .badge { font-size: 12px; font-weight: 600; color: var(--ok); }
  .divider { height: 1px; background: var(--border); }
  .status { font-size: 12.5px; color: var(--muted); min-height: 18px; }
  .status.err { color: var(--err); }
  .progress { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .progress .line { flex: 1; height: 1px; background: var(--border); }
  .pd { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; }
  .pd.active { background: var(--warn); } .pd.done { background: var(--ok); }

  /* 결과 */
  .result { text-align: center; display: grid; gap: 8px; justify-items: center; padding: 6px 0; }
  .result-cap { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
  .pill { font-weight: 800; font-size: 40px; padding: 4px 28px; border-radius: 12px; background: var(--surface2); color: var(--muted); line-height: 1.3; }
  .pill.m { background: var(--matcha-soft); color: var(--matcha); }
  .pill.t { background: var(--tea-soft); color: var(--tea); }
  .pill.w { background: var(--gray-soft); color: var(--warn); font-size: 26px; }
  .result-desc { font-size: 13.5px; color: var(--sub); max-width: 40ch; }
  .absvals { display: flex; gap: 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .absvals b { font-weight: 600; }

  /* 사진 */
  .drop { display: block; border: 1.5px dashed var(--border-strong); border-radius: 10px; padding: 26px 14px; text-align: center; color: var(--sub); cursor: pointer; font-weight: 600; }
  .drop:hover, .drop.over { border-color: var(--matcha); color: var(--text); }
  .drop input { display: none; }
  .drop small { display: block; font-weight: 400; color: var(--muted); margin-top: 4px; }
  #cv { width: 100%; border-radius: 8px; cursor: crosshair; display: block; touch-action: manipulation; }
  .swatch { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border); }
  footer { text-align: center; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="m">말차</span> <span class="or">or</span> <span class="t">녹차</span></h1>
    <nav class="tabs" aria-label="판별 방법">
      <button type="button" data-view="spectro" class="on">분광광도계</button>
      <button type="button" data-view="photo">반응지 사진</button>
    </nav>
  </header>

  <!-- ================= 분광광도계 ================= -->
  <section id="view-spectro" class="card">
    <div class="step">
      <div class="num" id="n1">1</div>
      <div class="step-body">
        <div class="step-title">기기 연결</div>
        <div class="btns"><button class="btn btn-primary" id="connBtn" type="button">연결하기</button></div>
        <div class="step-desc">PC의 Chrome 또는 Edge에서 USB로 연결하세요.</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="step">
      <div class="num" id="n2">2</div>
      <div class="step-body">
        <div class="step-title">보정</div>
        <div class="btns">
          <button class="btn" id="darkBtn" type="button" disabled>암보정</button>
          <button class="btn" id="brightBtn" type="button" disabled>증류수로 기준 잡기</button>
        </div>
        <div class="step-desc">암보정 <span class="badge" id="darkBadge"></span> → 증류수 큐벳을 넣고 기준 잡기 <span class="badge" id="brightBadge"></span></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="step">
      <div class="num" id="n3">3</div>
      <div class="step-body">
        <div class="step-title">시료 측정</div>
        <div class="step-desc">가루 3 g + 증류수 200 mL를 거르고 원심분리한 용액을 큐벳에 넣으세요.</div>
        <button class="btn btn-primary btn-wide" id="measureBtn" type="button" disabled>측정하기</button>
        <div class="progress" id="prog" hidden>
          <div class="pd" id="pdR"></div><span style="color:var(--cR)">RED</span><div class="line"></div>
          <div class="pd" id="pdG"></div><span style="color:var(--cG)">GREEN</span><div class="line"></div>
          <div class="pd" id="pdB"></div><span style="color:var(--cB)">BLUE</span>
        </div>
        <div class="status" id="sStatus"></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="result" aria-live="polite">
      <div class="result-cap">판별 결과</div>
      <div class="pill" id="sPill">—</div>
      <div class="result-desc" id="sDesc">측정하면 여기에 결과가 나옵니다.</div>
      <div class="absvals" id="sVals" hidden></div>
    </div>
  </section>

  <!-- ================= 반응지 사진 ================= -->
  <section id="view-photo" class="card" hidden>
    <label class="drop" id="drop" tabindex="0">
      <input type="file" id="file" accept="image/*">
      <span id="dropText">닌히드린 반응지 사진 올리기</span>
      <small>사진을 찍거나 고르세요</small>
    </label>
    <canvas id="cv" hidden></canvas>
    <div class="step-desc" id="cvHint" hidden style="text-align:center">보라색으로 변한 부분을 누르세요.</div>
    <div class="divider"></div>
    <div class="result" aria-live="polite">
      <div class="result-cap">판별 결과</div>
      <div class="swatch" id="swatch" hidden></div>
      <div class="pill" id="rPill">—</div>
      <div class="result-desc" id="rDesc">사진에서 발색 부분을 누르면 결과가 나옵니다.</div>
    </div>
  </section>

  <footer>경북과학고등학교 DARWIN</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const NAME = t => t === 'm' ? '말차' : '녹차';

// ── 탭 ──
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('view-spectro').hidden = b.dataset.view !== 'spectro';
  $('view-photo').hidden = b.dataset.view !== 'photo';
}));

// ── 분광광도계 판정 (평균 흡광도 0.39, 경계 0.34~0.44, 엽록소 지수 1.21) ──
function judgeSpec(a) {
  const A = (a[0] + a[1] + a[2]) / 3;
  const idx = a[1] > 0 ? (a[0] + a[2]) / 2 / a[1] : 0;
  const s1 = A >= 0.39 ? 'm' : 't', s3 = idx >= 1.21 ? 'm' : 't';
  const pill = $('sPill');
  if (A > 0.34 && A < 0.44) {
    pill.className = 'pill w'; pill.textContent = '판별 어려움';
    $('sDesc').textContent = '경계에 가까운 값입니다. 시료를 다시 만들어 측정해 주세요.';
  } else if (s1 !== s3) {
    pill.className = 'pill w'; pill.textContent = '다시 측정';
    $('sDesc').textContent = '측정값이 일관되지 않습니다. 용액 농도를 확인하고 다시 측정해 주세요.';
  } else {
    pill.className = 'pill ' + s1; pill.textContent = NAME(s1);
    $('sDesc').textContent = s1 === 'm' ? '엽록소가 많아 빛을 많이 흡수합니다.' : '엽록소가 적어 빛을 적게 흡수합니다.';
  }
  $('sVals').hidden = false;
  $('sVals').innerHTML = `<span>R <b>${a[0].toFixed(3)}</b></span><span>G <b>${a[1].toFixed(3)}</b></span><span>B <b>${a[2].toFixed(3)}</b></span>`;
}

// ── 시리얼 ──
let port = null, reader = null, writer = null, connected = false;
let calDark = false, calBright = false, lineBuf = '';
function status(msg, err) { $('sStatus').textContent = msg || ''; $('sStatus').className = 'status' + (err ? ' err' : ''); }

$('connBtn').onclick = () => connected ? disconnect() : connect();
$('darkBtn').onclick = () => sendCmd('D');
$('brightBtn').onclick = () => sendCmd('B');
$('measureBtn').onclick = () => {
  $('measureBtn').disabled = true;
  ['R', 'G', 'B'].forEach(c => setPD(c, ''));
  $('prog').hidden = false; status('측정 준비 중...');
  sendCmd('C');
};

async function connect() {
  if (!('serial' in navigator)) { status('이 브라우저는 기기 연결을 지원하지 않습니다. PC의 Chrome 또는 Edge를 사용하세요.', true); return; }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });
    const dec = new TextDecoderStream(); port.readable.pipeTo(dec.writable);
    reader = dec.readable.getReader();
    const enc = new TextEncoderStream(); enc.readable.pipeTo(port.writable);
    writer = enc.writable.getWriter();
    connected = true; updateUI(); status('');
    readLoop();
  } catch (e) { status('연결하지 못했습니다: ' + e.message, true); }
}
async function disconnect() {
  try { if (reader) await reader.cancel(); if (writer) await writer.close(); if (port) await port.close(); } catch (e) {}
  port = reader = writer = null; connected = false; updateUI();
}
function updateUI() {
  $('connBtn').textContent = connected ? '연결 해제' : '연결하기';
  $('n1').classList.toggle('done', connected);
  $('darkBtn').disabled = $('brightBtn').disabled = !connected;
  $('darkBadge').textContent = calDark ? '완료' : '';
  $('brightBadge').textContent = calBright ? '완료' : '';
  $('n2').classList.toggle('done', calDark && calBright);
  $('measureBtn').disabled = !connected;
}
async function readLoop() {
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      lineBuf += value;
      const lines = lineBuf.split('\n'); lineBuf = lines.pop();
      for (const l of lines) parseLine(l.trim());
    }
  } catch (e) { if (connected) status('기기와의 연결이 끊겼습니다.', true); }
}
function parseLine(line) {
  if (!line) return;
  if (line.startsWith('RESULT:')) {
    const p = line.substring(7).split(',').map(parseFloat);
    if (p.length === 3) {
      if (p.some(v => isNaN(v) || v < 0)) { status('측정값이 올바르지 않습니다. 보정 후 다시 측정해 주세요.', true); return; }
      judgeSpec(p);
    }
  } else if (line.startsWith('STATUS:')) {
    handleStatus(line.substring(7));
  } else if (line.startsWith('DARK:')) {
    calDark = true; updateUI();
  } else if (line.startsWith('ERROR:')) {
    status('오류: ' + line.substring(6), true);
    $('prog').hidden = true; $('measureBtn').disabled = !connected;
  }
}
function handleStatus(s) {
  if (s === 'DARK_DONE') { calDark = true; updateUI(); }
  else if (s === 'BRIGHT_CALIBRATING') { $('brightBtn').disabled = true; status('기준 빛 세기 측정 중...'); }
  else if (s === 'BRIGHT_DONE') { calBright = true; updateUI(); status(''); $('prog').hidden = true; }
  else if (s === 'SETTLING_RED') { setPD('R', 'active'); status('RED 측정 중...'); }
  else if (s === 'SETTLING_GREEN') { setPD('R', 'done'); setPD('G', 'active'); status('GREEN 측정 중...'); }
  else if (s === 'SETTLING_BLUE') { setPD('G', 'done'); setPD('B', 'active'); status('BLUE 측정 중...'); }
  else if (s === 'CONVERT_DONE') { setPD('B', 'done'); status(''); $('measureBtn').disabled = !connected; $('n3').classList.add('done'); }
}
function setPD(ch, st) { $('pd' + ch).className = 'pd ' + st; }
async function sendCmd(cmd) { if (!writer) return; try { await writer.write(cmd); } catch (e) {} }

// ── 반응지 사진 판정 (G 70, 경계 60~77) ──
function judgeRGB(rgb) {
  const [r, g, b] = rgb.map(Math.round);
  $('swatch').hidden = false; $('swatch').style.background = `rgb(${r},${g},${b})`;
  const pill = $('rPill');
  if ((r + b) / 2 - g < 8) {
    pill.className = 'pill w'; pill.textContent = '다시 선택';
    $('rDesc').textContent = '보라색 부분이 아닌 것 같습니다. 발색된 부분을 눌러 주세요.';
  } else if (g > 60 && g < 77) {
    pill.className = 'pill w'; pill.textContent = '판별 어려움';
    $('rDesc').textContent = '경계에 가까운 색입니다. 밝은 곳에서 다시 찍어 주세요.';
  } else {
    const t = g <= 70 ? 'm' : 't';
    pill.className = 'pill ' + t; pill.textContent = NAME(t);
    $('rDesc').textContent = t === 'm' ? '진한 보라색: 유리 아미노산(테아닌)이 많습니다.' : '연한 보라색: 유리 아미노산이 적습니다.';
  }
}
const cv = $('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
let img = null, mark = null;
function draw() {
  if (!img) return;
  const w = Math.min(900, img.naturalWidth), h = Math.round(w * img.naturalHeight / img.naturalWidth);
  cv.width = w; cv.height = h; ctx.drawImage(img, 0, 0, w, h);
  if (mark) { ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.strokeRect(mark[0] - 8, mark[1] - 8, 16, 16); ctx.lineWidth = 1.5; ctx.strokeStyle = '#000'; ctx.strokeRect(mark[0] - 10, mark[1] - 10, 20, 20); }
}
function load(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const im = new Image();
  im.onload = () => { img = im; mark = null; cv.hidden = false; $('cvHint').hidden = false; $('dropText').textContent = '다른 사진 올리기'; draw(); };
  im.src = URL.createObjectURL(file);
}
$('file').addEventListener('change', e => load(e.target.files[0]));
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); });
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
cv.addEventListener('click', e => {
  const rc = cv.getBoundingClientRect();
  const x = Math.round((e.clientX - rc.left) * cv.width / rc.width), y = Math.round((e.clientY - rc.top) * cv.height / rc.height);
  mark = null; draw();
  const x0 = Math.max(0, x - 4), y0 = Math.max(0, y - 4);
  const d = ctx.getImageData(x0, y0, Math.min(9, cv.width - x0), Math.min(9, cv.height - y0)).data;
  const s = [0, 0, 0]; let n = 0;
  for (let i = 0; i < d.length; i += 4) { s[0] += d[i]; s[1] += d[i + 1]; s[2] += d[i + 2]; n++; }
  mark = [x, y]; draw();
  judgeRGB(s.map(v => v / n));
});
</script>
</body>
</html>
